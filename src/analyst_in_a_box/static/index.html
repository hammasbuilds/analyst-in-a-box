<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyst-in-a-Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M7 23V15M13 23V9M19 23v-6M25 23V12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script>
  try { var t = localStorage.getItem("aib-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 23V15M13 23V9M19 23v-6M25 23V12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      Analyst-in-a-Box
    </a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="foot">
      <label for="actor">Acting as</label>
      <select id="actor" title="Who you are. There is no login: this name is used for approvals and the audit trail."></select>
      <div class="row"><span class="small muted" id="llmstat"></span>
        <button class="icon-btn right" id="theme" title="Switch light / dark" aria-label="Switch light or dark mode">&#9680;</button></div>
    </div>
  </aside>
  <main id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
