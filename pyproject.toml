[project]
name = "analyst-in-a-box"
version = "0.1.0"
description = "An AI back office for a small business: ask your data, forecast demand, flag fraud, score customer risk, run approvals, see the dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "sqlglot>=26.0",
    "openpyxl>=3.1",
    "demand-forecast-platform",
    "credit-risk-engine",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[tool.uv.sources]
demand-forecast-platform = { path = "../demand-forecast-platform" }
credit-risk-engine = { path = "../credit-risk-engine" }

[project.scripts]
analyst-in-a-box = "analyst_in_a_box.launcher:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst_in_a_box"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/analyst_in_a_box/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
